<!doctype html>
<html>
<head><meta charset="utf-8"><title>debug-kiosk3</title></head>
<body>
<pre id="info">starting</pre>
<iframe id="f" src="/" style="width:1400px;height:900px"></iframe>
<script>
const info = document.getElementById('info');
function log(s) { info.textContent += '\n' + s; }
const f = document.getElementById('f');

function tap(x, y) {
  const w = f.contentWindow, d = f.contentDocument;
  const el = d.elementFromPoint(x, y) || d.body;
  ['pointerdown','mousedown','touchstart','pointerup','mouseup','click','touchend'].forEach(t => {
    el.dispatchEvent(new w.MouseEvent(t, {bubbles:true, cancelable:true, view:w, clientX:x, clientY:y}));
  });
  return el;
}

let stage = 0;
const timer = setInterval(() => {
  let w, d;
  try { w = f.contentWindow; d = f.contentDocument; } catch (e) { return; }
  if (!d || !d.body) return;

  if (stage === 0) { stage = 1; tap(700, 450); return; }
  const t = d.body.innerText || '';
  if (stage === 1) { if (t.indexOf('Коснитесь') >= 0) { tap(700, 450); return; } stage = 2; return; }

  if (stage === 2) {
    const cat = Array.from(d.querySelectorAll('button,[role="button"]')).find(b => (b.textContent||'').trim() === 'Одежда');
    if (cat) { cat.click(); stage = 3; }
    return;
  }

  if (stage === 3) {
    const store = Array.from(d.querySelectorAll('button,[role="button"],li,a')).find(b => /BEFREE/i.test(b.textContent||''));
    if (store) { store.click(); stage = 4; }
    return;
  }

  if (stage === 4) {
    const cont = Array.from(d.querySelectorAll('button,[role="button"]')).find(b => /Продолжить маршрут/i.test(b.textContent||''));
    if (cont) { log('click CONTINUE'); cont.click(); stage = 5; return; }
    return;
  }

  if (stage === 5) {
    log('FINAL: ' + t.slice(0, 600).replace(/\n+/g, ' | '));
    const err = t.match(/Не удалось[^|]{0,90}/g) || t.match(/не найден[^|]{0,90}/gi);
    log('ROUTE_ERR=' + (err ? err.join(',') : 'none'));
    stage = 6;
  }
}, 2500);

setTimeout(() => { clearInterval(timer); log('DONE'); }, 40000);
</script>
</body>
</html>
