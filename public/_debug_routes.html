<!doctype html>
<html>
<head><meta charset="utf-8"><title>debug</title></head>
<body>
<pre id="info">starting</pre>
<iframe id="f" src="/admin" style="width:1500px;height:950px"></iframe>
<script>
const info = document.getElementById('info');
function log(s) { info.textContent += '\n' + s; }
try {
  localStorage.setItem('greenmall_admin', JSON.stringify({ accessToken: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjbXNnNHRrbjQwMDI3ZXNkYzJ4Ym42eGM1IiwiZW1haWwiOiJhZG1pbkBncmVlbm1hbGwubG9jYWwiLCJyb2xlIjoiU1VQRVJfQURNSU4iLCJpYXQiOjE3OTE5OTQyNzcsImV4cCI6MTc5MjA4MDY3N30.JG2WMaXkbzyeNdw3Ww4OrkyiUNpi6Cgb7VrQik6RKA4' }));
  log('token set');
} catch (e) { log('token ERR ' + e.message); }

const f = document.getElementById('f');
let clicked = false;
const poll = setInterval(() => {
  let d;
  try { d = f.contentDocument; } catch (e) { return; }
  if (!d) return;
  const btns = Array.from(d.querySelectorAll('nav button'));
  if (clicked) return;
  const routes = btns.find(b => b.textContent.trim() === 'Маршруты');
  if (routes) {
    routes.click();
    clicked = true;
    clearInterval(poll);
    log('clicked routes');
  }
}, 400);

setTimeout(() => {
  let d;
  try { d = f.contentDocument; } catch (e) { log('iframe ERR ' + e.message); return; }
  if (!d) { log('no doc'); return; }
  const sel = d.querySelector('select');
  log('floorSelect=' + (sel ? sel.value : 'none'));
  const opts = sel ? Array.from(sel.options).map(o => o.value) : [];
  log('floorOptions=' + opts.join(','));
  const txt = d.body.innerText;
  const m = txt.match(/Узлы \(\d+\)/g);
  const n = txt.match(/Рёбра \(\d+\)/g);
  log('nodesHdr=' + (m ? m.join(',') : 'none'));
  log('edgesHdr=' + (n ? n.join(',') : 'none'));
  const aside = d.querySelector('aside');
  log('SIDEBAR: ' + (aside ? aside.innerText.slice(0, 1500).replace(/\n+/g, ' | ') : 'no aside'));
  const loading = txt.match(/Загрузка[^|]{0,20}/g);
  log('loadingMsgs=' + (loading ? loading.join(',') : 'none'));
}, 30000);
</script>
</body>
</html>
