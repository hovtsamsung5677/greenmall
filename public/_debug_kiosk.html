<!doctype html>
<html>
<head><meta charset="utf-8"><title>debug-kiosk</title></head>
<body>
<pre id="info">starting</pre>
<iframe id="f" src="/" style="width:1400px;height:900px"></iframe>
<script>
const info = document.getElementById('info');
function log(s) { info.textContent += '\n' + s; }
const f = document.getElementById('f');

function tap() {
  const w = f.contentWindow, d = f.contentDocument;
  const el = d.elementFromPoint(700, 450) || d.body;
  ['pointerdown','mousedown','touchstart','pointerup','mouseup','click','touchend'].forEach(t => {
    el.dispatchEvent(new w.MouseEvent(t, {bubbles:true, cancelable:true, view:w, clientX:700, clientY:450}));
  });
  log('tapped at 700,450 on ' + (el.tagName || '?'));
}

let stage = 0;
const timer = setInterval(() => {
  let w, d;
  try { w = f.contentWindow; d = f.contentDocument; } catch (e) { return; }
  if (!d || !d.body) return;
  if (stage === 0) { stage = 1; tap(); log('stage0->tap done'); return; }
  if (stage === 1) {
    const t = d.body.innerText || '';
    if (t.indexOf('Коснитесь') >= 0) { tap(); return; }
    stage = 2;
    log('splash gone. body len=' + t.length);
    log('HEAD: ' + t.slice(0, 300).replace(/\n+/g,' | '));
    return;
  }
  if (stage === 2) {
    // ищем кликабельные магазины
    const btns = Array.from(d.querySelectorAll('button,[role="button"],li,a'));
    log('clickables=' + btns.length);
    const store = btns.find(b => /BEFREE|Спортмастер|Zara|Технопарк/i.test(b.textContent||''));
    if (store) {
      log('clicking store: ' + store.textContent.trim().slice(0,60));
      store.click();
      stage = 3;
      setTimeout(() => {
        const t2 = d.body.innerText || '';
        log('AFTER STORE HEAD: ' + t2.slice(0, 400).replace(/\n+/g,' | '));
        const err = t2.match(/Не удалось[^|]{0,60}/g);
        log('errors=' + (err ? err.join(',') : 'none'));
      }, 6000);
    } else {
      log('no store button found');
      stage = 3;
    }
  }
}, 2500);
</script>
</body>
</html>
